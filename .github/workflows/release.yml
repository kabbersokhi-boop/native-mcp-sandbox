name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-publish:
    name: Build, attest, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes ninja-build nlohmann-json3-dev

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Validate tag and project versions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fq "VERSION ${version}" CMakeLists.txt
          grep -Fq "version = \"${version}\"" agent/pyproject.toml
          grep -Fq "VERSION = \"${version}\"" scripts/run_agent_investigation_demo.py
          test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Configure and build native server
        run: >-
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DNMS_WARNINGS_AS_ERRORS=ON

      - name: Test native server
        run: |
          cmake --build build/release --parallel 2
          ctest --test-dir build/release --output-on-failure
          ./build/release/native-mcp-sandbox --version
          ./build/release/native-mcp-sandbox --self-check

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage/native stage/source
          DESTDIR="$GITHUB_WORKSPACE/stage/native" cmake --install build/release --strip
          cpack --config build/release/CPackConfig.cmake -B dist
          uv build --project agent --out-dir dist
          git archive HEAD | tar -x -C stage/source

      - name: Generate native SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: stage/native
          format: spdx-json
          output-file: dist/native-mcp-sandbox-${{ github.ref_name }}-linux-x86_64.spdx.json
          upload-artifact: false

      - name: Generate source SPDX SBOM
        uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: stage/source
          format: spdx-json
          output-file: dist/native-mcp-sandbox-${{ github.ref_name }}-source.spdx.json
          upload-artifact: false

      - name: Record checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "Native MCP Sandbox $GITHUB_REF_NAME"
          --notes-file "docs/releases/$GITHUB_REF_NAME.md"
