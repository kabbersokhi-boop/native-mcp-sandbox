[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "native-mcp-agent"
version = "0.11.0"
description = "A bounded investigation agent for the Native MCP Sandbox evidence server."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kabir Sokhi" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["native_mcp_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["native_mcp_agent"]
